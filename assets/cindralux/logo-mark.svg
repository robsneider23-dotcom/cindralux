<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Cindralux">
  <!-- Emblem: ein geschliffener Edelstein, von oben rechts angeleuchtet.
       "Cinder" (Glutfunke) steckt in den warmen Facettentoenen, "lux"
       (Licht) im Glanzpunkt oben. Sechs flache Facetten statt Weichzeichner
       — das Motiv soll als geschliffenes Objekt lesbar bleiben, nicht als
       glühender Fleck. -->
  <defs>
    <filter id="cx-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <polygon points="32,32 32,10 51.1,21" fill="#ffb088"/>
  <polygon points="32,32 51.1,21 51.1,43" fill="#ff5a1f"/>
  <polygon points="32,32 51.1,43 32,54" fill="#ff3c12"/>
  <polygon points="32,32 32,54 12.9,43" fill="#a8360f"/>
  <polygon points="32,32 12.9,43 12.9,21" fill="#e8501c"/>
  <polygon points="32,32 12.9,21 32,10" fill="#ff8a52"/>
  <polygon points="32,10 51.1,21 51.1,43 32,54 12.9,43 12.9,21" fill="none" stroke="#ff5a1f" stroke-width="1" opacity="0.35"/>
  <polygon points="38,15.5 40.3,18 38,20.5 35.7,18" fill="#fff5ec" opacity="0.9" filter="url(#cx-glow)"/>
</svg>
