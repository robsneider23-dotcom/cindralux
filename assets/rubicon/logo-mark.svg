<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Rubicon">
  <!-- Emblem: der ueberschrittene Fluss. Gestrichelte Linie = die Grenze,
       der Chevron kreuzt sie. Platzhalter — leicht durch echtes Logo ersetzbar. -->
  <defs>
    <linearGradient id="rb-ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8a52"/>
      <stop offset="55%" stop-color="#ff5a1f"/>
      <stop offset="100%" stop-color="#ff3c12"/>
    </linearGradient>
    <filter id="rb-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <polygon points="32,4 56.2,18 56.2,46 32,60 7.8,46 7.8,18"
           fill="none" stroke="url(#rb-ember)" stroke-width="1.6" opacity="0.55"/>
  <polygon points="32,11 50.1,21.5 50.1,42.5 32,53 13.9,42.5 13.9,21.5"
           fill="#ff5a1f" opacity="0.05"/>

  <line x1="6" y1="32" x2="58" y2="32"
        stroke="#ff5a1f" stroke-width="1.4" stroke-dasharray="3 4" opacity="0.45"/>

  <polyline points="24,46 39,32 24,18" fill="none" stroke="url(#rb-ember)"
            stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"
            filter="url(#rb-glow)"/>
</svg>
