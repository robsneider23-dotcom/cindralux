<!doctype html>
<html lang="de" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050505" />
    <!-- Kiosk-Modus: als Vollbild-Web-App behandeln, keine Browser-Chrome. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>CINDRALUX — Home Command Center</title>
    <link rel="icon" type="image/svg+xml" href="/cindralux/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Alle Schriftpaarungen aus theme/tokens.js (fontPairings) in einer
      Anfrage — geladen wird immer alles, gewechselt wird nur die
      CSS-Variable --font-sans/--font-mono (siehe store.tsx). Das kostet beim
      ersten Start etwas mehr Ladezeit, dafuer greift ein spaeterer
      Schriftwechsel in den Einstellungen sofort, ohne Nachladen.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&family=Sora:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500&family=Public+Sans:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!--
      Schriften der Design-Richtungen (appearance.skin, siehe
      theme/skins.css) — separat von den Schriftpaarungen oben, weil jeder
      Skin sein eigenes, festes Paar mitbringt statt eine der sechs
      Schriftpaarungen zu nutzen.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Karla:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Quicksand:wght@500;600;700&family=Mulish:wght@400;500;600;700&family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Orbitron:wght@500;600;700;800&family=Rajdhani:wght@400;500;600;700&family=Urbanist:wght@400;500;600;700;800&family=Audiowide&family=Chakra+Petch:wght@400;500;600;700&family=Unbounded:wght@300;400;500;600&family=Hanken+Grotesk:wght@400;500;600;700&family=Share+Tech+Mono&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Work+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
